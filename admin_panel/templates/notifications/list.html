<!-- Notification Modal Popup -->
<div class="modal fade" id="notificationModal" tabindex="-1" aria-labelledby="notificationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            
            <!-- Modal Header -->
            <div class="modal-header">
                <h5 class="modal-title" id="notificationModalLabel">
                    <i class="bi bi-bell me-2"></i>Notifications
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body p-0">
                {% if notifications %}
                    <div class="list-group list-group-flush">
                        {% for n in notifications %}
                            <div class="list-group-item p-3 {% if not n.is_read %}bg-light{% endif %}">
                                <div class="fw-bold d-flex justify-content-between align-items-center mb-1">
                                    <span>{{ n.title }}</span>
                                    <span class="badge bg-secondary rounded-pill" style="font-size: 0.7rem;">
                                        {{ n.get_notification_type_display }}
                                    </span>
                                </div>
                                <p class="mb-1 text-muted small">{{ n.message }}</p>
                                <small class="text-secondary" style="font-size: 0.75rem;">
                                    {{ n.created_at|date:"M d, Y, H:i" }}
                                </small>
                            </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="text-center py-5">
                        <i class="bi bi-bell-slash text-muted display-6 mb-2"></i>
                        <p class="text-muted mb-0">No notifications found.</p>
                    </div>
                {% endif %}
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
            </div>

        </div>
    </div>
</div>
